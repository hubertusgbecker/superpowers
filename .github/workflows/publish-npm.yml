name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Skip when NPM_TOKEN is not configured
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::notice::NPM_TOKEN secret is not set; skipping npm publish."

      - uses: actions/checkout@v7
        if: env.HAS_NPM_TOKEN == 'true'

      - uses: actions/setup-node@v7
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Require tag to match package.json version
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "Release tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - name: Telemetry and network guard
        if: env.HAS_NPM_TOKEN == 'true'
        run: node tests/brainstorm-server/branding.test.js

      # The unscoped "superpowers" name on npm belongs to another publisher.
      - name: Scope the package name for npm
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm pkg set name=@hubertusgbecker/superpowers

      - name: Publish
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
