name: Publish to GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@hubertusgbecker"

      - name: Require tag to match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "Release tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - name: Telemetry and network guard
        run: node tests/brainstorm-server/branding.test.js

      # package.json keeps the unscoped name: OpenCode installs the plugin as "superpowers".
      - name: Scope the package name for GitHub Packages
        run: npm pkg set name=@hubertusgbecker/superpowers

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
